{% extends "base.html" %}

{% block content %}

<style>

body{
    background:#f4f6fb;
    font-family:Arial,sans-serif;
}

.success-wrapper{
    min-height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.success-box{
    background:white;
    max-width:700px;
    width:100%;
    border-radius:34px;
    padding:60px 40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.success-icon{
    font-size:90px;
    margin-bottom:25px;
}

.success-box h1{
    font-size:54px;
    color:#0b1b3a;
    margin-bottom:20px;
    font-weight:900;
}

.success-box p{
    color:#666;
    line-height:1.9;
    font-size:18px;
    margin-bottom:35px;
}

.success-btn{
    display:inline-block;
    padding:18px 35px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:18px;
    font-weight:800;
    transition:0.25s;
}

.success-btn:hover{
    background:#ea8c04;
}

@media(max-width:800px){

    .success-box{
        padding:40px 25px;
    }

    .success-box h1{
        font-size:38px;
    }

}

</style>

<section class="success-wrapper">

    <div class="success-box">

        <div class="success-icon">✅</div>

        <h1>Rezervacija uspješna!</h1>

        <p>
            Vaša autobusna karta je uspješno rezervirana.
            Hvala što putujete s Livno Busom.
        </p>

        <a href="/" class="success-btn">
            Povratak na početnu
        </a>

    </div>

</section>

{% endblock %}
