{% extends "base.html" %}

{% block content %}

<style>

body{
    background:#f4f6fb;
    font-family:Arial,sans-serif;
}

.dest-wrapper{
    max-width:1400px;
    margin:auto;
    padding:60px 20px;
}

.dest-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:22px;
}

.dest-card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,0.07);
    display:flex;
    flex-direction:column;
    height:100%;
}

.dest-card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.dest-content{
    padding:22px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.dest-content h3{
    font-size:24px;
    color:#0b1b3a;
    margin-bottom:12px;
    font-weight:800;
    text-align:center;
}

.dest-content p{
    color:#666;
    font-size:15px;
    line-height:1.7;
    text-align:center;
    flex:1;
}

/* 🔥 FIX BUTTON POSITION */
.dest-btn{
    display:block;
    width:100%;
    padding:14px 0;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:14px;
    font-weight:700;
    text-align:center;
    margin-top:auto;
}

.dest-btn:hover{
    background:#ea8c04;
}

@media(max-width:1200px){
    .dest-grid{grid-template-columns:repeat(3,1fr);}
}

@media(max-width:850px){
    .dest-grid{grid-template-columns:1fr;}
}

</style>

<section class="dest-wrapper">

    <div class="dest-grid">

        {% for destinacija in destinacije %}

        <div class="dest-card">

            <img src="{{ destinacija.slika }}">

            <div class="dest-content">

                <h3>{{ destinacija.naziv }}</h3>

                <p>{{ destinacija.opis }}</p>

                <a href="{% url 'destinacija_detalji' destinacija.slug %}" class="dest-btn">
                    Saznaj više
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
