{% extends "base.html" %}

{% block content %}

<style>

.hero{
    width:100%;
    height:450px;
    background:
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url("{{ destinacija.slika }}");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    text-align:center;
}

.hero h1{
    font-size:70px;
}

.content{
    max-width:1200px;
    margin:auto;
    padding:60px 20px;
}

.box{
    background:white;
    padding:40px;
    border-radius:30px;
}

</style>

<section class="hero">

    <h1>{{ destinacija.naziv }}</h1>

</section>

<section class="content">

    <div class="box">

        <p>{{ destinacija.opis }}</p>

    </div>

</section>

{% endblock %}
